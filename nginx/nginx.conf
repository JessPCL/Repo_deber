events { 
    worker_connections 1024; 
}

http {
    upstream backend_apaches {
        server apache1:80;
        server apache2:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend_apaches;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
